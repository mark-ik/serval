[package]
name = "tabard"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/merely-made/genet"
description = "Theme-authoring port for Genet: Tinct seeds in, typed DTCG design tokens and Livery CSS custom-property stylesheets out."
readme = "README.md"
keywords = ["theme", "design-tokens", "oklch", "palette", "icons"]
categories = ["gui", "graphics"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tinct = { version = "=0.1.2", path = "../../components/tinct" }

[dev-dependencies]
genet-livery = { version = "0.0.2", path = "../../components/genet-livery" }
genet-static-dom = { version = "0.1.0", path = "../../components/genet-static-dom" }
layout-dom-api = { version = "0.1.0", path = "../../components/shared/layout-dom" }
livery = { version = "0.0.3", path = "../../components/livery" }
