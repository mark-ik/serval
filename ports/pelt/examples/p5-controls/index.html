<!doctype html>
<meta charset="utf-8">
<title>P5 controls and nested scroll</title>
<style>
  :root {
    color-scheme: light;
    font: 14px/1.3 sans-serif;
    background: #f4efe4;
    color: #2f2923;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 448px; margin: 0 auto; padding: 12px 16px; }
  h1 { margin: 0 0 4px; color: #6b1f2d; font-size: 22px; line-height: 1.05; }
  .lede { margin: 0 0 8px; color: #5b5147; }
  .columns { position: relative; height: 190px; }
  section { position: absolute; top: 0; width: 196px; }
  .scroll-column { left: 0; }
  .form-column { left: 212px; }
  h2 { margin: 0 0 4px; font-size: 16px; }
  .scrollbox {
    height: 150px;
    overflow: auto;
    padding: 7px 8px;
    border: 3px solid #8b7355;
    background: #fffaf0;
  }
  .scrollbox p { margin: 0 0 8px; padding: 5px 6px; background: #e4d8bd; }
  .scrollbox .finish { margin-top: 60px; background: #bfd7d5; }
  form { padding: 6px 8px; background: #eef7f5; }
  label { display: block; margin: 0 0 2px; font-weight: 700; }
  input, textarea, button { width: 174px; font: inherit; }
  input, textarea {
    margin: 0 0 5px;
    padding: 4px 6px;
    border: 2px solid #8b7355;
    background: white;
    color: #2f2923;
  }
  textarea { min-height: 42px; resize: none; }
  input:focus, textarea:focus { border-color: #075985; }
  button { padding: 5px 7px; border: 0; background: #2f2923; color: white; }
</style>
<main>
  <h1>Scroll locally. Edit retained state.</h1>
  <p class="lede">The panel owns the wheel. The form owns the edit.</p>
  <div class="columns">
    <section class="scroll-column">
      <h2>Nested activity</h2>
      <div class="scrollbox">
        <p>Control log start</p>
        <p>Local scrolling keeps the page heading fixed.</p>
        <p>The panel has its own retained offset.</p>
        <p class="finish">Later entries become visible after the receipt wheel.</p>
      </div>
    </section>
    <section class="form-column">
      <h2>Editable form</h2>
      <form action="result.html" method="get">
        <label for="note">Retained note</label>
        <textarea id="note" name="note">cedar</textarea>
        <label for="subject">Subject</label>
        <input id="subject" name="subject" value="Pelt receipt">
        <button type="submit">Keep locally</button>
      </form>
    </section>
  </div>
</main>
