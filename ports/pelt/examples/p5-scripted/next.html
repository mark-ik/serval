<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pelt scripted navigation</title>
  <style>
    :root {
      font: 18px/1.5 sans-serif;
      background: #e8f0f4;
      color: #1c2f3b;
    }
    body {
      margin: 0;
      padding: 54px;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 28px;
      background: white;
      border: 2px solid #7894a3;
    }
    h1 {
      margin: 0 0 16px;
      color: #234f67;
    }
  </style>

<body>
  <main>
    <h1>Scripted navigation arrived</h1>
    <p id="arrival">Replacement script pending.</p>
  </main>
  <script>
    document.getElementById('arrival').textContent = 'Replacement script ready.';
  </script>

</html>
