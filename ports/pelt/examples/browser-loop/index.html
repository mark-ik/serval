<!doctype html>
<meta charset="utf-8">
<title>Pelt browser loop</title>
<style>
  :root { color-scheme: light; font: 18px/1.45 sans-serif; background: #f4efe4; color: #2f2923; }
  body { max-width: 42rem; margin: 3rem auto; padding: 0 2rem; }
  h1 { font-size: 2.4rem; line-height: 1.05; }
  a { color: #075985; }
  textarea { display: block; width: 100%; min-height: 7rem; margin: 1rem 0; padding: .75rem; font: inherit; background: white; border: 2px solid #8b7355; }
  textarea:focus { border-color: #075985; }
  button { padding: .6rem 1rem; font: inherit; background: #2f2923; color: white; border: 0; }
  .receipt { padding: .8rem 1rem; background: #e4d8bd; }
</style>
<main>
  <p class="receipt">P1 receipt: link, editable form, GET submission, reload, back, and forward.</p>
  <h1>A small browser has to go somewhere.</h1>
  <p><a href="next.html">Follow a relative link</a>, then use Alt+Left and Alt+Right.</p>
  <form action="result.html" method="get">
    <label for="note">Leave a note for the next document</label>
    <textarea id="note" name="note">cedar</textarea>
    <button type="submit">Submit locally</button>
  </form>
  <p>Ctrl+R, F5, or the browser refresh key reloads the active document.</p>
</main>
