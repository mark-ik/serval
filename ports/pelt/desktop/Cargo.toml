[package]
name = "pelt-desktop"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description.workspace = true

[lib]
name = "pelt_desktop"
path = "lib.rs"
bench = false

[features]
default = ["livery", "reader", "netfetch"]
# Engine-neutral headed presentation. Both engines can produce a `Scene`; this
# feature owns only the winit/wgpu shell that presents one.
present = [
    "dep:netrender", "dep:genet-winit-host", "dep:inker", "dep:wgpu",
    "dep:raw-window-handle", "dep:image",
]
# Registry-routed owned static engine plus the engine-neutral present shell.
livery = [
    "present", "dep:genet-documents", "genet-documents/livery", "dep:inker",
    "dep:cambium", "dep:cambium-genet-winit-host", "dep:genet-livery", "dep:genet-scripted-dom",
    "dep:genet-render", "dep:accesskit", "dep:layout-dom-api", "dep:paint_list_render", "dep:url",
    "dep:windows", "dep:dpi", "dep:scrying-engine",
]
# Named developer receipt for applying a Tabard artifact to Pelt Chrome. This
# stays optional so the generic shell has no Tabard runtime dependency.
tabard-preview = ["livery", "dep:tabard", "dep:tinct"]
# Named developer receipt for mapping Tabard's portable palette onto the
# already-owned Reader host palette. This does not persist a Pelt theme.
tabard-reader-preview = ["livery", "reader", "dep:tabard", "dep:tinct"]
# Shared fleece reader lane over the portable document canvas.
reader = [
    "present", "dep:genet-documents", "genet-documents/reader", "dep:inker",
]
# The scripted profile (V4): a live `ScriptedDom` document whose inline `<script>`
# runs through `script-runtime-api` on a JS engine, mutating the DOM, rendered each
# frame. GPU-free at the core (scene production only); the headed run reuses the
# engine-neutral present stack. Boa is the default engine (pure Rust, all
# targets); Nova is gated behind `scripted-nova` so the default build links a single
# engine (Boa+Nova+wgpu together exceed the Windows image-size link limit).
scripted = [
    "present", "livery", "genet-documents/scripted",
    "dep:genet-scripted",
    "dep:script-runtime-api", "dep:script-engine-api",
    "dep:script-engine-boa",
    "dep:fleece",
]
# Compatibility feature spelling; the scripted route is already Livery/Buckram.
livery-scripted = ["scripted", "genet-documents/livery-scripted"]
# Add the Nova engine to the scripted profile (64-bit targets, including wasm64).
# Off by default; enabling
# it links a second engine, which on Windows can exceed the linker's image-size limit
# alongside wgpu — build it on Linux/macOS, or Windows without the present stack.
scripted-nova = ["scripted", "dep:script-engine-nova"]
# Remote document loading (V1's http(s) half): the `LocalFetcher` gains an http(s)
# branch backed by the netfetcher engine (the sibling Fetch network engine; the same
# wiring genet-wpt's `fetch()` uses). Default-on so the reference browser visibly
# exercises real pages; `--no-default-features` remains the light contracts build.
# The host owns networking here (pelt is the reference shell), matching meerkat
# driving netfetcher in the product; genet's engine components stay byte-consuming.
netfetch = ["dep:genet-documents", "genet-documents/netfetch"]
# Smolweb document loading (the `smolweb` feature): the `LocalFetcher` gains a
# gemini/gopher/nex/finger/spartan/guppy branch backed by the errand transport (the
# sibling smolweb engine), bridged onto the sync `ResourceFetcher` through the same
# tokio runtime the netfetch branch uses. Off by default so the default build stays
# free of the async network stack -- `pelt --features smolweb gemini://…` needs this.
# The host owns networking (pelt is the reference shell), matching meerkat driving
# errand in the product; genet's engine components stay byte-consuming. errand pulls
# its own tokio net/time/io-util features, which unify with the `rt` runtime here.
smolweb = ["livery", "genet-documents/smolweb"]
netrender = ["dep:netrender", "dep:webgl_wgpu", "dep:wgpu"]
# Headed presentation through genet's `WindowsDxgiBackend`. Drives
# the netrender renderer through the C4 DCOMP composition swapchain
# attached to a winit window's HWND. Windows-only at runtime; the
# feature gate is platform-agnostic so `cargo check --features
# windows-present` works on non-Windows hosts (the inner code is
# `cfg(target_os = "windows")` gated).
windows-present = [
    "netrender", "dep:paint", "dep:raw-window-handle", "dep:windows",
    "dep:pollster",
]
# Headed presentation through genet's `MacosCALayerBackend`. Drives
# the netrender renderer through the C4 CAMetalLayer attached to a
# winit window's NSView. macOS/iOS-only at runtime; the feature gate
# is platform-agnostic so `cargo check --features macos-present`
# works on non-Apple hosts (the inner code is `cfg(target_vendor =
# "apple")` gated). The NSView -> CALayer extraction lives in
# `paint::compositor_factory`; pelt-desktop calls
# `default_compositor_for_window` and doesn't need its own AppKit
# / objc2 deps.
macos-present = [
    "netrender",
    "dep:paint",
    "dep:raw-window-handle",
    "dep:pollster",
]
# Headed presentation through genet's `WaylandSubsurfaceBackend`. Drives
# the netrender renderer through a winit Wayland window with per-`SurfaceKey`
# subsurfaces. Linux-only at runtime; the feature gate is platform-agnostic so
# `cargo check --features linux-present` works on non-Linux hosts (the inner
# code is `cfg(target_os = "linux")` gated). The wl_display + wl_surface
# extraction lives in `paint::compositor_factory`; pelt-desktop calls
# `default_compositor_for_window` and doesn't need its own wayland-client deps.
linux-present = [
    "netrender",
    "dep:paint",
    "dep:raw-window-handle",
    "dep:pollster",
]

[dependencies]
cambium = { path = "../../../components/cambium/cambium", optional = true }
cambium-genet-winit-host = { path = "../../../components/cambium/cambium-genet-winit-host", optional = true }
netrender = { workspace = true, optional = true }
image = { workspace = true, optional = true }
paint = { workspace = true, optional = true }
genet-host-api = { workspace = true }
genet-documents = { workspace = true, optional = true, default-features = false }
genet-livery = { path = "../../../components/genet-livery", optional = true }
genet-render = { path = "../../../components/genet-render", optional = true }
inker = { workspace = true, optional = true }
accesskit = { workspace = true, optional = true }
pelt-core = { workspace = true }
tabard = { path = "../../tabard", optional = true }
tinct = { workspace = true, optional = true }
pollster = { version = "0.4", optional = true }
raw-window-handle = { workspace = true, optional = true }
webgl_wgpu = { workspace = true, optional = true }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"], optional = true }
winit = { workspace = true }
paint_list_render = { workspace = true, optional = true }

# The render-free extraction lane: extract a PageExtract from the live post-JS DOM
# (the headless-scripted-DOM scrape path for SPAs). Depends only on layout-dom-api.
fleece = { path = "../../../components/fleece", optional = true }
genet-winit-host = { path = "../../../components/genet-winit-host", optional = true }
# Spec `data:` URL decoding for the LocalFetcher (percent-encoded + base64 bodies).

# Remote document loading (behind the `netfetch` feature): the netfetcher engine
# (sibling repo) for http(s), bridged onto the sync `ResourceFetcher` through a tokio
# runtime. The same dep set genet-wpt's `fetch()` uses.
url = { workspace = true, optional = true }

# Smolweb document loading (behind the `smolweb` feature): the errand transport
# (sibling repo) for gemini/gopher/nex/finger/spartan/guppy, bridged onto the sync
# `ResourceFetcher` through the shared tokio runtime. Brings its own tokio + rustls.
# Native smolweb documents lower through Nematic, `EngineDocument`, and
# `document-canvas`; Pelt consumes the resulting engine-native session.

# Scripted profile (behind the `scripted` feature): the browser host surface, the
# live mutable DOM, and the JS engines. `script-engine-api` supplies the
# `ScriptEngine` trait bound the engine-generic `ScriptedDocument<E>` is written
# against; Boa is the default backend, Nova the gated one (`scripted-nova`).
script-runtime-api = { path = "../../../components/script-runtime-api", optional = true }
script-engine-api = { path = "../../../components/script-engine-api", optional = true }
genet-scripted-dom = { path = "../../../components/genet-scripted-dom", optional = true }
genet-scripted = { path = "../../../components/genet-scripted", optional = true, default-features = false }
script-engine-boa = { path = "../../../components/script-engine-boa", optional = true }
script-engine-nova = { path = "../../../components/script-engine-nova", optional = true }
# The `LayoutDom` trait (for the inline-`<script>` DOM walk) + QualName parts.
layout-dom-api = { path = "../../../components/shared/layout-dom", optional = true }
# External-script post-fetch processing (scripted feature): `encoding_rs` decodes the
# fetched bytes per the `<script charset>` (default UTF-8); `sha2` + `base64` verify a
# `<script integrity>` Subresource-Integrity hash before the script is allowed to run.
encoding_rs = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
# Windows presentation bridges HWND into paint; the Livery workspace also
# imports D3D12 textures and constructs its registered Scrying producer.
windows = { workspace = true, features = ["Win32_System_Threading"], optional = true }
dpi = { workspace = true, optional = true }
scrying-engine = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux-only ash extension NAME constants used by the `linux-present`
# feature's `smoke_wayland::build_vulkan_handles` to enable the dmabuf
# export extensions on the wgpu-hal Vulkan device before handing it to
# wgpu via `Adapter::create_device_from_hal`. Version matches paint's
# (which in turn matches wgpu-hal 29's lockfile pin 0.38.0+1.3.281).
ash = "0.38"


[dev-dependencies]
# The fixture-5 receipt inspects the concrete retained resource-ledger types
# returned by `LiveryDocumentSession::resource_set()`.
genet-document-resources = { workspace = true }
# Offline mock HTTP server for the netfetch (http(s)) integration test, so it runs
# without a live network. Mirrors genet-wpt's fetch()->netfetcher test harness.
mockito = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(llvm_pgo)'] }
