[package]
name = "buckram"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/genet"
description = "Standards-owned CSS box and fragment models for Genet."
publish = true

[lib]
path = "src/lib.rs"

[dependencies]
# Grows the box-tree descent's stack on demand; see `box_tree::with_box_tree_stack`.
stacker = "0.1.21"
taffy = { package = "genet-taffy", version = "0.14.0", default-features = false, features = ["std", "block_layout", "float_layout", "flexbox", "grid", "calc", "detailed_layout_info"] }
