[package]
name = "sprigging"
version = "0.2.1"
description = "Retained custom-paint leaves and arrangement helpers for Rust GUI hosts"
edition.workspace = true
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/merely-made/genet"
publish = true

[dependencies]
paint_list_api.workspace = true
accesskit = { version = "0.24.0", features = ["serde"] }
vello = { version = "0.10", default-features = false }
