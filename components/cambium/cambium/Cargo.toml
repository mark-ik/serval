[package]
name = "cambium"
version = "0.3.3"
description = "A Meristem backend and application toolkit for Genet"
edition.workspace = true
rust-version = "1.92"
license = "MPL-2.0"
repository = "https://github.com/merely-made/genet"
publish = true

[features]
highlight = ["dep:illume", "dep:tinct"]

[dependencies]
meristem = { version = "0.2.0", path = "../meristem" }
sprigging = { version = "0.2.0", path = "../sprigging" }
genet-scripted-dom = { version = "0.1.0", path = "../../genet-scripted-dom" }
# Cambium also renders host settings and surface descriptors, which remain
# product-neutral Genet host contracts rather than workspace vocabulary.
mere-surface-api = { workspace = true }
# The pane-frame contract Frisket renders. Its host effects remain for the
# embedding shell to interpret, while the component owns one vocabulary.
workbench = { workspace = true }
layout_dom_api = { package = "layout-dom-api", version = "0.1.0", path = "../../shared/layout-dom" }
unicode-segmentation = "1.13.2"
illume = { workspace = true, optional = true }
tinct = { workspace = true, optional = true }
