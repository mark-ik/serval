[package]
name = "cambium-genet-winit-host"
version = "0.1.0"
description = "The single-root Cambium desktop host: winit lifecycle, Livery/Buckram layout and paint, input routing, and AccessKit sync over one GenetAppRunner"
edition.workspace = true
rust-version = "1.92"
license = "MPL-2.0"
repository = "https://github.com/merely-made/genet"
# Rides genet-livery / genet-winit-host, which inherit genet's publish = false,
# so this host can never publish either — the same posture as
# cambium-winit-a11y, and the reason cambium-winit stays a separate thin
# published crate. Consumers take this from genet.git by branch.
publish = false

[dependencies]
# The accessibility tree type the host projects into and hands the adapter;
# named here so the `Harness` can return one for a test to assert against.
accesskit = "0.24"
meristem = { version = "0.1.0", path = "../meristem" }
cambium = { version = "0.3.3", path = "../cambium" }
cambium-winit = { version = "0.3.0", path = "../cambium-winit" }
cambium-winit-a11y = { version = "0.3.0", path = "../cambium-winit-a11y" }
sprigging = { version = "0.2.1", path = "../sprigging" }
genet-livery = { path = "../../genet-livery" }
genet-render = { path = "../../genet-render" }
# The semantic-selector resolver the headless `Harness` drives applications by,
# so a host test targets a control by role and label rather than by pixel.
genet-probe = { path = "../../genet-probe" }
genet-scripted-dom = { path = "../../genet-scripted-dom" }
genet-winit-host = { path = "../../genet-winit-host" }
layout_dom_api = { package = "layout-dom-api", path = "../../shared/layout-dom" }
livery = { version = "0.0.2", path = "../../livery" }
netrender = { workspace = true }
paint_list_api = { workspace = true }
paint_list_render = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# W1: query AppKit's real traffic-light geometry from winit's NSView so the
# standard titlebar-area-* environment rectangle follows the running macOS
# style instead of baking one machine's title-bar measurements into the host.
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["std", "NSButton", "NSControl", "NSView", "NSWindow"] }
raw-window-handle = { workspace = true }

[dev-dependencies]
# The tests drive the harness by role/label, and read the DOM directly for the
# assertions the state does not carry.
layout_dom_api = { package = "layout-dom-api", path = "../../shared/layout-dom" }
