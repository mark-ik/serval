[package]
name = "cambium-winit"
version = "0.3.0"
description = "winit input translation for Cambium applications"
edition.workspace = true
rust-version = "1.92"
license = "MPL-2.0"
repository = "https://github.com/merely-made/genet"
publish = true

# Two dependencies, and it stays that way. The a11y host moved to
# `cambium-winit-a11y` on 2026-07-26 because its then-current Genet layout host
# dependencies were unpublished and made this crate
# unpublishable with them. Adding anything unpublishable here undoes that.
[dependencies]
cambium = { version = "0.3.3", path = "../cambium" }
winit = "0.30.13"
# The fade clock. std::time::Instant panics on wasm32-unknown-unknown; this
# re-exports std on native and performance.now() on wasm.
web-time = "1"
