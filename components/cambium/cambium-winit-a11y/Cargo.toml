[package]
name = "cambium-winit-a11y"
version = "0.3.0"
description = "AccessKit hosting for genet-backed Cambium applications on winit"
edition.workspace = true
rust-version = "1.92"
license = "MPL-2.0"
repository = "https://github.com/merely-made/genet"
# Platform adapter lifecycle over a caller-projected AccessKit tree. Engine
# projection belongs to the engine host, so this crate carries no layout edge.
publish = false

[dependencies]
winit = "0.30.13"
accesskit = "0.24"
genet-winit-host = { path = "../../genet-winit-host" }
genet-scripted-dom = { path = "../../genet-scripted-dom" }
