[package]
name = "inker"
# Own version line (not workspace): published crate, 0.0.1 name-claim bumped to
# 0.1.0 on first publish from this repo (inker-adoption plan, 2026-07-09).
version = "0.1.1"
edition.workspace = true
authors = ["Mark AB (markik)"]
# MPL-2.0 per the 2026-08-22 posture brief; the published 0.1.1 keeps the
# MIT OR Apache-2.0 grant it shipped with.
license = "MPL-2.0"
# Not workspace: genet's workspace repository still points at upstream servo.
repository = "https://github.com/merely-made/genet"
description = "Modular engine/renderer controller — selects and orchestrates content engines (genet HTML lanes, nematic smolweb, scrying/graft/weld surface engines)."
documentation = "https://docs.rs/inker"
readme = "README.md"
keywords = ["engine", "renderer", "controller", "browser", "modular"]
categories = ["web-programming"]
# Override genet's workspace-wide publish = false: inker is a published crate.
publish = true

[lib]
path = "src/lib.rs"

[dependencies]
# The engine-facing contract half, split out under the platform boundary plan.
document-session-api = { workspace = true }
# Kernel-free by design (the seiche precedent): routing context takes petgraph's
# NodeIndex directly (mere's kernel NodeKey is an alias of the same type) and an
# own uuid-backed view-id newtype, so inker serves any host graph.
petgraph = { version = "0.8.3", features = ["serde-1"] }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
