[package]
name = "weld-engine"
version.workspace = true
edition.workspace = true
authors = ["Mark AB (markik)"]
# Not workspace: this crate is ours, not Servo-derived, so it keeps the founding
# license rather than inheriting genet's MPL-2.0.
license = "MPL-2.0"
repository.workspace = true
description = "inker SurfaceEngine implementation backed by the wgpu-weld CEF (Chromium) accelerated-OSR embedding."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
inker.workspace = true
tracing.workspace = true

# NOTE: deliberately NO `welding` / `cef` dependency. Like `graft-engine`, this
# crate defines the `WeldSurface` host seam. The concrete host supplies CEF and
# chooses its frame hand-off: welding's imported-texture API or a transferred
# raw shared handle for an external compositor. Keeping this crate inker-only
# avoids resolving the CEF / Chromium distribution into an engine consumer.
