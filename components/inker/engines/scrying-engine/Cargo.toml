[package]
name = "scrying-engine"
version.workspace = true
edition.workspace = true
authors = ["Mark AB (markik)"]
# Not workspace: this crate is ours, not Servo-derived, so it keeps the founding
# license rather than inheriting genet's MPL-2.0.
license = "MIT OR Apache-2.0"
repository.workspace = true
description = "inker SurfaceEngine implementation backed by the scrying system-WebView producer (WebView2 / WKWebView / WebKitGTK)."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
inker.workspace = true
# Sibling repo consumed one-way; a **git dep** (not a path dep) so a bare clone
# builds without the `wgpu-scry` sibling layout. A local checkout is picked up via
# the gitignored `.cargo/config.toml` `paths` override.
# scrying carries feature-selected wgpu rows so hosts on adjacent majors do
# not move in lockstep. Genet names its row explicitly even though wgpu 30 is
# now Scry's default: an imported texture has to come from the same wgpu major
# as the host device, and an implicit default can silently add a second stack
# when either side advances.
scrying = { git = "https://github.com/merely-made/wgpu-scry.git", rev = "01e411ef35237d4c562dd311ace68977a5b9c78f", default-features = false, features = [
    "wgpu-30",
] }
dpi.workspace = true
tracing.workspace = true
wgpu.workspace = true
