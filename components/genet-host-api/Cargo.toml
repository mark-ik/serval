[package]
name = "genet-host-api"
version = "0.2.0"
repository = "https://github.com/merely-made/genet"
publish = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Raw engine host contracts for Genet: engine profiles, capabilities, resource fetching, and href resolution."
keywords = ["genet", "host", "engine", "contract"]
categories = ["gui", "api-bindings"]

[lib]
name = "genet_host_api"
path = "lib.rs"
bench = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(llvm_pgo)'] }
