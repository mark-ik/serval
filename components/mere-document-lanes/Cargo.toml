[package]
name = "mere-document-lanes"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository = "https://github.com/merely-made/genet"
description = "Mere's document content lanes above Genet: the reader and smolweb sessions over the portable document canvas, and the remote resource fetcher over netfetcher and errand. Mere's half of the former genet-documents, homed here until the platform boundary plan moves it."
publish = true

[lib]
path = "src/lib.rs"

[features]
default = []
# Remote http(s) loading for RemoteFetcher via the netfetcher engine.
netfetch = ["dep:netfetcher", "dep:tokio", "dep:bytes"]
# The smolweb engine-native lane: errand transport and Nematic EngineDocument
# lowering; the reader lane is unconditional.
smolweb = ["dep:errand", "dep:nematic", "dep:tokio"]

[dependencies]
document-session-api = { workspace = true }
inker = { workspace = true }
genet-host-api = { workspace = true }
genet-static-dom = { path = "../genet-static-dom" }
fleece = { path = "../fleece" }
netrender = { workspace = true }
document-canvas = { workspace = true, features = ["netrender"] }
image = { workspace = true }
url = { workspace = true }
nematic = { workspace = true, optional = true }
errand = { workspace = true, optional = true }
netfetcher = { path = "../netfetcher", optional = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"], optional = true }
bytes = { workspace = true, optional = true }

[dev-dependencies]
# Offline mock HTTP server for the netfetch integration tests; runs without a
# live network.
mockito = "1"
wgpu = { workspace = true }
